[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Proxy same-origin al backend (Heroku) — ANTES del catch-all SPA.
# Same-origin => sin CORS; sin VITE_API_URL horneada => sin secrets-scanning.
[[redirects]]
  from = "/api/*"
  to = "https://funaroundyou-f21e91cae36c.herokuapp.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://funaroundyou-f21e91cae36c.herokuapp.com/auth/:splat"
  status = 200
  force = true

# Redirecciones para SPA (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
